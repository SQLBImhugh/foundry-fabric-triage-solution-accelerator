name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      # The suite must pass with no credentials and no tenant. If a change makes
      # a test reach the network, it fails here rather than in front of a
      # customer -- there is nothing in this job for it to reach.
      - name: Test
        run: python -m pytest -q

      # Inspect code rather than matching mocked module names or source fixtures.
      # Runtime offline tests remain the primary behavior check.
      - name: No network in the test path
        run: python scripts/check_offline_tests.py

  command-center:
    name: Command-center tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and lint
        run: npm run typecheck && npm run lint

      - name: Offline UI tests
        run: npm run test -- --reporter=dot

      - name: Production build and asset verification
        run: npm run build

  secrets:
    name: No credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The same scanner the tests exercise, run against every change. It knows
      # the shapes that matter here: client secrets, webhook URLs and approval
      # callback URLs, all of which are bearer credentials.
      - name: Scan
        run: python scripts/scan_secrets.py
