name: scenario10-pipeline-rerun-approved
title: Approved pipeline rerun with verified completion
description: A scheduled copy reports an ADLS internal service error. Reviewed replay parameters and an explicit approval permit one new run.
approval:
  mode: auto_approve
pipeline:
  target:
    name: Orders ingestion
    workspace_id: "10000000-0000-0000-0000-000000000001"
    pipeline_id: "20000000-0000-0000-0000-000000000002"
    rerun_safe: true
    rerun_parameters:
      businessDate: "2026-09-10"
  runs:
    - id: "30000000-0000-0000-0000-000000000003"
      item_id: "20000000-0000-0000-0000-000000000002"
