name: scenario6-approval-denied
title: "Scenario 6 - Human declines, and nothing happens"
description: >-
  Identical to scenario 5 until the decision. The human says no, and the fix is
  never applied. The run ends as approval_denied rather than as a failure or a
  false success - the system worked exactly as intended, and a person exercised
  the judgement it was never given.
email: mock/emails/05-gateway-repeating.json

datasets:
  - name: daily_sales
    path: mock/data/daily_sales_clean.csv
    key_columns: [store_id, sales_date]

powerbi:
  workspace_id: b8e42d17-3f6a-4c9b-8d21-77e4a1c9f003
  dataset_id: 4e6b1d90-3c72-4a58-8f19-b27ec5a40d83
  refresh_result: Completed
  refresh_history:
    - {requestId: b71fc2a5-8e04-4d63-9a12-7c5e10bd3f6a, status: Failed, refreshType: Scheduled, startTime: "2026-08-27T05:00:02Z"}
    - {requestId: 3d92a7c1-64be-4f08-b5d3-91ca7e2b40f7, status: Failed, refreshType: Scheduled, startTime: "2026-08-26T05:00:04Z"}
    - {requestId: 8f14e5b2-27da-4c96-a071-6be3f9d15c28, status: Failed, refreshType: Scheduled, startTime: "2026-08-25T05:00:01Z"}

approval:
  mode: auto_deny
  approver: m.hughes@contoso.com
  reason: "gw-onprem-02 also serves the finance datasets. Not during close week - raise a change request."

expect:
  outcome: approval_denied
  remediation_applied: false
  flags_written: 0
  approval_requested: true
  approval_granted: false
  denied_actions: 1
  blocked_attempts: 0

narration:
  - "Nothing was changed. The gateway rebind was never dispatched."
  - "The denial reason is the interesting artefact - it encodes context the agent could not have had."
  - "A denial does NOT consume the remediation budget. A human saying no must not disarm the agent for the rest of the incident."
  - "Set approval.mode to 'timeout' to see the same branch when nobody answers: silence is also a no."
