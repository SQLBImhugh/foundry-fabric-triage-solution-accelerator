[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-fabric-triage-solution-accelerator"
version = "1.0.0"
description = "Multi-agent triage and remediation for Power BI failures, on Azure AI Foundry"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything needed to run against a real Azure tenant. The accelerator runs
# end-to-end WITHOUT these installed, using the mock provider and mock tools.
azure = [
    "azure-identity>=1.17",
    "azure-ai-projects>=1.0.0b4",
    "openai>=1.40",
    "azure-monitor-opentelemetry>=1.6",
    "msal>=1.28",
    # Durable state lives in an Azure SQL Database. Microsoft's own driver is
    # used rather than pyodbc because it ships the ODBC driver inside the wheel
    # (as mssql-python-odbc), so it installs with pip alone. pyodbc needs the
    # msodbcsql18 *system* package, which cannot be installed in the Foundry
    # hosted agent image -- that container is built by pip from
    # src/requirements.txt and nothing else.
    "mssql-python>=1.14",
]
monitoring = [
    "azure-eventhub>=5.15,<6",
    # The async identity and WebSocket transport need this optional HTTP client.
    "aiohttp>=3.14.3,<4",
]
# Only needed to run the controller AS a Foundry hosted agent. Kept separate so
# the offline path never pulls in the hosting stack.
#
# Pinned to match src/requirements.txt, which is what the container installs.
# agent-framework-foundry-hosting ships date-stamped betas that make breaking
# changes without a major bump, and a floating floor once crash-looped the
# deployed container at startup. Bump both files together.
hosted = [
    "agent-framework-core>=1.17,<2",
    "agent-framework-foundry-hosting==1.0.0b260910",
    "mssql-python>=1.14",
    "azure-identity>=1.17",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyJWT[crypto]>=2.9,<3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyJWT[crypto]>=2.9,<3",
]

[project.scripts]
bi-triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
